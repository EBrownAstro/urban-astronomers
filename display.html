<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Astronomers — Live Display</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15) brightness(.72)}#shade{position:absolute;inset:0;background:radial-gradient(circle at 53% 55%,rgba(0,0,0,.05),rgba(0,3,16,.38) 55%,rgba(0,2,10,.6))}#space{position:absolute;inset:0;width:100%;height:100%}.title{position:absolute;left:30px;top:24px}.ey{font-size:12px;letter-spacing:.24em;color:#75dcff;font-weight:900}.title h1{font-size:36px;margin:5px 0}.title p{margin:0;color:#d4deec}.empty{position:absolute;left:50%;top:73%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.82);transition:opacity .4s}.empty b{font-size:21px}.empty small{display:block;margin-top:5px}.live{position:absolute;right:30px;top:25px;background:rgba(2,9,28,.68);border:1px solid rgba(255,255,255,.18);border-radius:17px;padding:11px 16px;text-align:center}.live b{color:#75dcff}.key{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);white-space:nowrap;background:rgba(2,9,28,.68);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 18px;font-weight:800}.count{position:absolute;left:28px;bottom:22px;background:rgba(2,9,28,.65);padding:10px 14px;border-radius:13px}.controls{position:absolute;right:24px;bottom:18px;display:flex;gap:7px}.controls button{border:1px solid rgba(255,255,255,.18);background:rgba(2,9,28,.78);color:white;border-radius:12px;padding:10px 13px;font-weight:750}</style></head><body>
<img id="bg" src="starfield-reference.png" alt=""><div id="shade"></div><canvas id="space"></canvas><div class="title"><div class="ey">URBAN ASTRONOMERS • CAIRNS</div><h1></h1></div><div class="live"><b>● LIVE</b><br><small id="connection">Connecting…</small></div><div id="empty" class="empty"><b>Our solar system is waiting…</b><small>Scan a colouring sheet QR code and launch the first planet.</small></div><div class="count"><b id="count">0</b> worlds created</div><div class="key">🔥 closer = warmer + faster &nbsp; • &nbsp; ❄️ further = colder + much slower</div><div class="controls"><button id="pause">Pause</button><button id="clear">Hide all</button></div>
<script>

const SUPA_URL='https://ffoluszrxgmscpwnuhql.supabase.co';
const SUPA_KEY='sb_publishable_ybduIo69hLm0fPuivTK5GA_XD5xbIz4';
const EVENT_ID=new URLSearchParams(location.search).get('event')||'cairns-demo';

const c=document.querySelector('#space'),x=c.getContext('2d'),empty=document.querySelector('#empty'),count=document.querySelector('#count'),conn=document.querySelector('#connection');let W,H,D,worlds=[],paused=false,last=performance.now(),seen=new Set();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function addRow(r){if(seen.has(r.id)||r.event_id!==EVENT_ID)return;seen.add(r.id);const im=new Image();im.src=r.image_data||'';worlds.push({id:r.id,d:Math.max(1,Math.min(9,+r.distance||5)),s:r.planet_size==='small'?9:r.planet_size==='giant'?46:23,a:Math.random()*6.283,img:im,moons:+r.moon_count||0,mc:r.moon_colour||'#eef4ff',ring:!!r.has_rings,rc:r.ring_colour||'#ffd36a'});empty.style.opacity=0;count.textContent=worlds.length}
async function load(){try{const r=await fetch(SUPA_URL+'/rest/v1/planets?event_id=eq.'+encodeURIComponent(EVENT_ID)+'&select=*&order=created_at.asc',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});if(!r.ok)throw new Error(await r.text());(await r.json()).forEach(addRow);conn.textContent='Connected';}catch(e){console.error(e);conn.textContent='Connection error'}}
let newest='1970-01-01T00:00:00Z';async function poll(){try{const r=await fetch(SUPA_URL+'/rest/v1/planets?event_id=eq.'+encodeURIComponent(EVENT_ID)+'&created_at=gt.'+encodeURIComponent(newest)+'&select=*&order=created_at.asc',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});if(r.ok){const rows=await r.json();rows.forEach(q=>{addRow(q);if(q.created_at>newest)newest=q.created_at});conn.textContent='Connected'}}catch(e){conn.textContent='Reconnecting…'}setTimeout(poll,1200)}
function planet(p,px,py){if(p.ring){x.save();x.strokeStyle=p.rc;x.globalAlpha=.9;x.lineWidth=Math.max(3,p.s*.18);x.beginPath();x.ellipse(px,py,p.s*1.8,p.s*.45,-.2,0,6.283);x.stroke();x.restore()}x.save();x.beginPath();x.arc(px,py,p.s,0,6.283);x.clip();if(p.img.complete&&p.img.naturalWidth)x.drawImage(p.img,px-p.s,py-p.s,p.s*2,p.s*2);else{x.fillStyle='#6ed2ff';x.fillRect(px-p.s,py-p.s,p.s*2,p.s*2)}x.restore();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1;x.beginPath();x.arc(px,py,p.s,0,6.283);x.stroke();for(let m=0;m<p.moons;m++){let layer=Math.floor(m/5),a=p.a*1.5+m*6.283/Math.max(p.moons,1),rr=p.s*1.6+layer*(p.s*.55+5)+(m%2)*4;x.fillStyle=p.mc;x.beginPath();x.arc(px+Math.cos(a)*rr,py+Math.sin(a)*rr*.62,Math.max(2.5,Math.min(5,p.s*.13)),0,6.283);x.fill()}}
function draw(t){x.clearRect(0,0,W,H);let cx=W*.53,cy=H*.55,b=Math.min(W,H);for(let i=1;i<=9;i++){let r=b*(.105+i*.047);x.strokeStyle='rgba(220,238,255,.15)';x.beginPath();x.ellipse(cx,cy,r,r*.61,0,0,6.283);x.stroke()}let g=x.createRadialGradient(cx,cy,0,cx,cy,88);g.addColorStop(0,'#fffde1');g.addColorStop(.22,'#ffe267');g.addColorStop(.52,'rgba(255,154,45,.75)');g.addColorStop(1,'rgba(255,130,20,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,88,0,6.283);x.fill();x.fillStyle='#ffdc68';x.beginPath();x.arc(cx,cy,29,0,6.283);x.fill();let dt=Math.min(.04,(t-last)/1000);last=t;worlds.forEach(p=>{if(!paused)p.a+=(3/Math.pow(p.d,2.05))*dt;let r=b*(.105+p.d*.047),px=cx+Math.cos(p.a)*r,py=cy+Math.sin(p.a)*r*.61;planet(p,px,py)});requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#clear').onclick=()=>{worlds=[];seen.clear();count.textContent=0;empty.style.opacity=1};load().then(()=>{worlds.forEach(w=>{});if(worlds.length){newest=new Date().toISOString()}poll()});
</script></body></html>
